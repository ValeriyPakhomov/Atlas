name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Declared explicitly: the Settings default is deliberately the most
      # restrictive value, so every deployed and automated context names its own.
      ATLAS_ENVIRONMENT: ci
      ATLAS_TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # uv sync installs from uv.lock, so CI resolves exactly what a developer ran.
      - name: Install project
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy packages apps tests

      - name: Test
        run: uv run pytest

  boundaries:
    name: architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      # The domain package must import with the standard library alone. Installing
      # pytest without the project's runtime dependencies proves that claim instead
      # of asserting it in prose (ADR-0001).
      - name: Install test runner only
        run: |
          uv venv --python 3.12 .boundary-venv
          uv pip install --python .boundary-venv/bin/python pytest

      - name: Domain imports cleanly with no runtime dependencies
        run: >-
          PYTHONPATH=packages .boundary-venv/bin/python
          -c "import atlas.domain.clock; print('domain ok')"

      - name: Boundary and determinism guards
        run: >-
          PYTHONPATH=packages:. .boundary-venv/bin/python -m pytest
          tests/unit/test_architecture_boundaries.py
          tests/unit/test_determinism_guards.py
